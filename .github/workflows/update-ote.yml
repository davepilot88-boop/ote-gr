name: Update OTE data
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ote-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/frontend.test.cjs
      - name: Fetch and validate OTE
        id: fetch
        continue-on-error: true
        run: python .github/workflows/update_ote.py
      - name: Commit verified data and diagnostic status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified OTE data'
            git push
          fi
      # GITHUB_TOKEN pushes do not trigger another Pages build: deploy explicitly.
      - name: Prepare public files
        run: |
          mkdir public
          cp index.html app.js manifest.webmanifest graf.png public/
          cp -r data public/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages (including error/unpublished status)
        uses: actions/deploy-pages@v4
      - name: Report fetch failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo '::error::OTE validation failed. Last valid prices were preserved. See Fetch and validate OTE logs.'
          exit 1
